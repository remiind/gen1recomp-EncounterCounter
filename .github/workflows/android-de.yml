name: Android APK (EncounterCounter fork)

# Debug-signed APK of this fork (German Emerald support), installed under its
# own application id so it sits next to the official app instead of
# replacing it. Uploaded as a workflow artifact only.

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform + NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653" > /dev/null

      # Fixed debug key: every run signs with the same certificate, so a new
      # APK installs over the previous one (keeps saves and the ROM cache).
      - name: Use the fork's debug keystore
        run: |
          mkdir -p ~/.android
          cp mobile/fork/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        env:
          GEN1RECOMP_APP_NAME: "gen1recomp DE"
          GEN1RECOMP_DEBUG_KEYSTORE: ${{ github.workspace }}/mobile/fork/debug.keystore
        run: |
          set -euo pipefail
          scripts/build_android.sh --test-application-id com.remiind.gen1recomp.de

      # Fail instead of shipping an APK that would not install over the last one
      - name: Check the signing certificate
        run: |
          set -euo pipefail
          SIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          for apk in $(find dist/android -name '*.apk'); do
            certs="$("$SIGNER" verify --print-certs "$apk")"
            echo "$apk"; echo "$certs" | grep -i sha-256
            echo "$certs" | grep -qi "d26338194ec04d64b8d6888224b3c23c1be8025ddf706af216cacbf6910cf7ce" \
              || { echo "APK is not signed with mobile/fork/debug.keystore"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: gen1recomp-DE-android
          path: dist/android/**/*.apk
          if-no-files-found: error
